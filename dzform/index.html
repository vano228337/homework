<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        <fieldset class="fs1">
            <legend>Ваши личные данные:</legend>
            <label>
                Ваше имя
                <input type="text" name="name" placeholder="Имя" required>
            </label>
            <label>
                Ваш возраст
                <input type="number" name="number" placeholder="Возраст" required>
            </label>
            <label>
                Ваш номер телефона
                <input type="tel" name="tel" placeholder="Телефон" required>
            </label>
            <label>
                Ваша почта
                <input type="email" name="email" placeholder="Почта" required>
            </label>
        </fieldset>
        <fieldset class="fs2">
            <label>
                Сообщение
                <textarea name="textarea" id="" placeholder="Ваше сообщение" required></textarea>
            </label>
            <br>
            <label>
                <input id="check" type="checkbox" required>
                Примите условия
            </label>
            <button>Отправить</button>
        </fieldset>
    </form>
</body>

</html>
