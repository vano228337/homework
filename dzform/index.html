<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/normalaiz.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <form class="form">
        <fieldset class="fs1 form-group">
            <legend class="fgt">Ваши личные данные:</legend>
            <label>
                Ваше имя
                <input class="input" type="text" name="name" placeholder="Имя" required>
            </label>
            <label>
                Ваш возраст
                <input class="input" type="number" name="number" placeholder="Возраст" required>
            </label>
            <label>
                Ваш номер телефона
                <input class="input" type="tel" name="tel" placeholder="Телефон" required>
            </label>
            <label>
                Ваша почта
                <input class="input" type="email" name="email" placeholder="Почта" required>
            </label>
        </fieldset>
        <fieldset class="fs2 form-group">
            <label>
                Сообщение
                <textarea name="textarea" placeholder="Ваше сообщение" required></textarea>
            </label>
            <label class="check-label">

                <input class="check" type="checkbox" required>
                Примите условия
            </label>

        </fieldset>
        <button class="button">Отправить</button>
    </form>
</body>

</html>
